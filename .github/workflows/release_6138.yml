name: Release GoalAlert 6.13.8 live scoreboard fix

on:
  push:
    branches: [main]
    paths:
      - 'scripts/release_6138.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: goalalert-6138-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair, test and build from verified 6.13.7
        run: python3 scripts/release_6138.py
      - name: Validate IPK privacy and update checksum
        run: python3 scripts/publish.py
      - name: Publish binary and latest.json
        run: |
          git config user.name "goalalert-update-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add enigma2-plugin-extensions-goalalert_6.13.8_all.ipk latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish GoalAlert 6.13.8 fixed LIVE scoreboard"
            git push
          fi
