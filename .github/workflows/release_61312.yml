name: Release GoalAlert 6.13.12 updater path hotfix

on:
  push:
    branches: [main]
    paths:
      - 'scripts/release_61312.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: goalalert-61312
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix, test and build 6.13.12 from verified base
        run: python3 scripts/release_61312.py
      - name: Validate public package, checksum and metadata
        run: python3 scripts/publish.py
      - name: Publish checked package and version manifest
        run: |
          git config user.name "goalalert-update-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add enigma2-plugin-extensions-goalalert_6.13.12_all.ipk latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish GoalAlert 6.13.12 reliable /tmp updater repair"
            git push
          fi
