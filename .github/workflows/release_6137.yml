name: Release GoalAlert 6.13.7 TV matching repair

on:
  push:
    branches: [main]
    paths:
      - 'scripts/release_6137.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: goalalert-6137-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch, regression-test, and build verified GoalAlert 6.13.7
        run: python3 scripts/release_6137.py
      - name: Validate public IPK and generate manifest
        run: python3 scripts/publish.py
      - name: Publish verified package and version manifest
        run: |
          git config user.name "goalalert-update-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add enigma2-plugin-extensions-goalalert_6.13.7_all.ipk latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish GoalAlert 6.13.7 LiveOnSat fixture fix"
            git push
          fi
