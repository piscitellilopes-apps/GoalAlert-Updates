name: GoalAlert 6.13.20 Twenty Stadium Cheers
on:
  push:
    branches: [main]
    paths:
      - 'scripts/goalalert_61320_request.txt'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: goalalert-61320-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Ensure ffmpeg available
        run: |
          if ! command -v ffmpeg; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
      - name: Download CC0 recordings and build GoalAlert 6.13.20
        run: |
          python3 scripts/release_61320.py
      - name: Verify package, source license and online-update manifest
        run: |
          python3 scripts/publish.py
          python3 - <<'PY'
          import hashlib,json,io,tarfile,subprocess
          from pathlib import Path
          m=json.loads(Path("latest.json").read_text())
          assert m["version"]=="6.13.20"
          p=Path(m["url"].split("/")[-1])
          assert p.exists() and p.stat().st_size<16*1024*1024
          assert hashlib.sha256(p.read_bytes()).hexdigest()==m["sha256"]
          with tarfile.open(fileobj=io.BytesIO(subprocess.check_output(["ar","p",str(p),"data.tar.xz"])),mode="r:xz") as a:
              names=[x.name for x in a.getmembers()]
          assert len([x for x in names if "/goal_fan_" in x and x.endswith(".wav")])==20
          assert any("GOALALERT_20_CHEERS_LICENSE" in x for x in names)
          print("20 embedded PCM WAV presets and SHA256 verified")
          PY
      - name: Publish new verified update for Vu+ TV
        run: |
          git config user.name goalalert-update-bot
          git config user.email github-actions[bot]@users.noreply.github.com
          git add enigma2-plugin-extensions-goalalert_6.13.20_all.ipk latest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Release GoalAlert 6.13.20 twenty stadium cheers'
            git push
          fi
