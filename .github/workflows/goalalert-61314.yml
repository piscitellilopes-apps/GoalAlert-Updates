name: GoalAlert 6.13.14 validated build
on:
  push:
    branches: [main]
    paths:
      - 'scripts/goalalert_61314_build_request.txt'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: goalalert-61314-release
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Build and run safety assertions
        run: |
          python3 -m pip install --disable-pip-version-check pillow
          python3 scripts/release_61314.py
      - name: Validate and produce online updater manifest
        run: |
          python3 scripts/publish.py
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib
          m=json.loads(Path('latest.json').read_text())
          assert m['version']=='6.13.14'
          p=Path(m['url'].split('/')[-1])
          assert hashlib.sha256(p.read_bytes()).hexdigest()==m['sha256']
          print('Verified GoalAlert online release:',m['version'],m['sha256'])
          PY
      - name: Publish signed-by-checksum package and manifest
        run: |
          git config user.name goalalert-update-bot
          git config user.email github-actions[bot]@users.noreply.github.com
          git add enigma2-plugin-extensions-goalalert_6.13.14_all.ipk latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish GoalAlert 6.13.14 after tests"
            git push
          fi
